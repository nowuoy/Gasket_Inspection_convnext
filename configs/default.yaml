# 이 파일의 TODO 항목은 촬영/라벨링/검증 데이터가 준비된 뒤 확정해야 합니다.
seed: 42 #난수
device: auto                 # auto | cpu | cuda

classes:
  - id: good
    name_ko: 양품
  - id: shrinkage
    name_ko: 수축불량
  - id: thread_defect
    name_ko: 나사선 불량
  - id: incomplete_molding
    name_ko: 미성형 불량
  - id: burr
    name_ko: burr 불량
  - id: contamination
    name_ko: 이염 불량

input:
  # 한 번의 학습/추론마다 상단면 또는 측면 사진 한 장만 독립적으로 처리합니다.
  image_size: 224            # TODO: 작은 burr가 보존되는지 확인 후 224/320/384 비교
  padding_value: [0, 0, 0] #이미지 비율을 유지하면서 빈 공간을 채울 때 사용할 RGB 색상
  mean: [0.485, 0.456, 0.406] #imagenet 사전학습 모델 이미지 정규화
  std: [0.229, 0.224, 0.225]

model:
  architecture: convnext_tiny
  pretrained: true
  dropout: 0.20
  # 아래 헤드는 해당 라벨을 실제로 수집한 뒤 true로 변경합니다.
  severity_head_enabled: true    # 0.0~1.0 severity 라벨용 / 결함이 얼마나 심한지 판별

train:
  manifest: data/labels.csv
  output_dir: runs  #학습 결과와 체크포인트를 저장하는 runs 파일, 실행 후 즉시 생성됨
  batch_size: 8  
  epochs: 30
  num_workers: 0             # Windows에서는 0부터 시작 권장
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.01
  label_smoothing: 0.05
  class_weighting: auto      # auto | none
  severity_loss_weight: 0.25  #severity head 손실 반영
  freeze_backbone_epochs: 3
  early_stopping_patience: 7
  checkpoint_metric: severity_mae  # macro_f1 | ng_recall | quality_f1 | severity_mae 체크포인트 선택 기준
  checkpoint_mode: min         # severity_mae를 선택할 때는 min
  mixed_precision: true
  group_columns: [lot_id, capture_session]  #데이터를 나눌 때 같은 lot이나 촬영 세션이 train/validation에 섞이지 않도록 그룹 기준으로 사용합니다.
  enforce_group_disjoint: true
  augmentation:  #데이터 증강 뻥튀기. 나중에 더 생각해보자.
    rotation_degrees: 5
    translate_fraction: 0.03
    brightness: 0.05
    contrast: 0.05
    saturation: 0.02         # 이염 신호를 훼손하지 않도록 강한 색 증강 금지

decision:
  criteria_version: TODO-v0  #판정기준 해야 돼.
  good_class: good
  # class_only | quality_head | severity
  # 현재 기본값은 결함 종류만으로 판정하는 임시 baseline입니다.
  strategy: severity
  min_class_confidence: null  # TODO: validation/calibration 결과로 설정
  low_confidence_action: NG   # OK | NG | REVIEW; 현장 안전을 위해 기본 NG
  severity_ng_thresholds:    # severity 전략을 켤 때 클래스별 TODO
    shrinkage: null
    thread_defect: null
    incomplete_molding: null
    burr: null
    contamination: null

inference:
  checkpoint: runs/best.pt   # 학습 후 생성되는 체크포인트 경로로 수정
  use_amp: true
  warmup_iterations: 2

realtime:
  inbox_dir: runtime/inbox
  results_dir: runtime/results
  state_db: runtime/state/inspections.sqlite3
  poll_interval_s: 0.20
  stable_checks: 3           # 크기/mtime이 연속으로 동일해야 읽음
  retry_errors: false
  retry_backoff_s: 5.0
  max_retry_attempts: 3
  # inspection_id에는 영문/숫자/_/-만 허용하여 경로 충돌을 방지합니다.
  filename_regex: "^(?P<id>[A-Za-z0-9_-]+)\\.(?P<ext>jpg|jpeg|png|bmp|tif|tiff)$"
