# 이 파일의 TODO 항목은 촬영/라벨링/검증 데이터가 준비된 뒤 확정해야 합니다.
seed: 42
device: auto                 # auto | cpu | cuda

classes:
  - id: good
    name_ko: 양품
  - id: shrinkage
    name_ko: 수축불량
  - id: thread_defect
    name_ko: 나사선 불량
  - id: incomplete_molding
    name_ko: 미성형 불량
  - id: burr
    name_ko: burr 불량
  - id: contamination
    name_ko: 이염 불량

input:
  # 한 번의 학습/추론마다 상단면 또는 측면 사진 한 장만 독립적으로 처리합니다.
  image_size: 224            # TODO: 작은 burr가 보존되는지 확인 후 224/320/384 비교
  padding_value: [0, 0, 0]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  architecture: convnext_tiny
  pretrained: true
  dropout: 0.20
  # class head는 불량 종류를, severity head는 결함 정도(0.0~1.0)를 예측합니다.

train:
  manifest: data/labels.csv
  output_dir: runs
  batch_size: 8
  epochs: 30
  num_workers: 0             # Windows에서는 0부터 시작 권장
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.01
  label_smoothing: 0.05
  class_weighting: auto      # auto | none
  severity_loss_weight: 1.0
  freeze_backbone_epochs: 3
  early_stopping_patience: 7
  checkpoint_metric: severity_mae  # severity_mae가 낮을수록 severity 예측이 정확함
  checkpoint_mode: min
  mixed_precision: true
  group_columns: [lot_id, capture_session]
  enforce_group_disjoint: true
  augmentation:
    rotation_degrees: 5
    translate_fraction: 0.03
    brightness: 0.05
    contrast: 0.05
    saturation: 0.02         # 이염 신호를 훼손하지 않도록 강한 색 증강 금지

decision:
  criteria_version: TODO-v0    # TODO: validation으로 threshold 확정 후 버전 변경
  good_class: good
  # 아래 0.5는 실행 가능한 임시 baseline이며 생산 판정 기준이 아닙니다.
  severity_ng_thresholds:
    shrinkage: 0.5
    thread_defect: 0.5
    incomplete_molding: 0.5
    burr: 0.5
    contamination: 0.5

inference:
  checkpoint: runs/best.pt   # 학습 후 생성되는 체크포인트 경로로 수정
  use_amp: true
  warmup_iterations: 2

realtime:
  inbox_dir: runtime/inbox
  results_dir: runtime/results
  state_db: runtime/state/inspections.sqlite3
  poll_interval_s: 0.20
  stable_checks: 3           # 크기/mtime이 연속으로 동일해야 읽음
  retry_errors: false
  retry_backoff_s: 5.0
  max_retry_attempts: 3
  # inspection_id에는 영문/숫자/_/-만 허용하여 경로 충돌을 방지합니다.
  filename_regex: "^(?P<id>[A-Za-z0-9_-]+)\\.(?P<ext>jpg|jpeg|png|bmp|tif|tiff)$"
